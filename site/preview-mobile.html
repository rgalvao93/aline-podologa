<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prévia mobile — Aline Amaral</title>
  <style>
    :root { color-scheme: light; --paper:#fbf7f1; --ink:#3a2b25; --muted:#705c52; --rose:#c4897a; --gold:#9b7446; --line:#e7d7c4; }
    * { box-sizing:border-box }
    html,body { margin:0; background:#e7ded5; color:var(--ink); font-family:'Jost','Helvetica Neue',sans-serif; }
    .page { width:390px; min-height:844px; margin:0 auto; padding:0 24px 22px; overflow:hidden; background:var(--paper); position:relative; }
    header { height:72px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; }
    .brand img { width:42px; height:42px; border-radius:50%; object-fit:cover; object-position:center 42%; }
    .brand-name { font:500 17px/1 Georgia,serif; letter-spacing:.12em; }
    .brand-sub { margin-top:5px; font-size:9px; letter-spacing:.22em; color:var(--gold); }
    .menu { width:28px; border-top:1px solid var(--gold); border-bottom:1px solid var(--gold); height:8px; position:relative; }
    .menu:after { content:''; position:absolute; top:3px; width:100%; border-top:1px solid var(--gold); }
    .intro { padding-top:36px; }
    .eyebrow { margin:0 0 15px; color:var(--gold); font-size:10px; letter-spacing:.22em; text-transform:uppercase; }
    h1 { margin:0; font:400 43px/.99 Georgia,'Times New Roman',serif; letter-spacing:-.035em; }
    h1 em { color:#a96756; font-weight:400; }
    .lead { margin:17px 0 0; max-width:312px; color:var(--muted); font-size:14px; line-height:1.55; }
    .cta { margin-top:21px; height:50px; border-radius:2px; display:flex; align-items:center; justify-content:center; gap:10px; background:var(--ink); color:#fffaf4; font-size:13px; letter-spacing:.04em; }
    .wa { width:18px; height:18px; border:1px solid #e1c99e; border-radius:50%; position:relative; }
    .wa:after { content:'↗'; position:absolute; font-size:11px; left:4px; top:0; color:#e1c99e; }
    .photo { margin-top:24px; height:300px; position:relative; overflow:hidden; background:#edd4c7; }
    .photo img { width:100%; height:100%; object-fit:cover; object-position:center 47%; }
    .photo:after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, transparent 58%, rgba(52,35,29,.26)); }
    .photo-caption { position:absolute; bottom:16px; left:17px; z-index:1; color:white; font:italic 17px Georgia,serif; text-shadow:0 1px 5px #59453b; }
    .values { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:17px 0 15px; border-bottom:1px solid var(--line); color:var(--muted); font-size:10px; letter-spacing:.04em; }
    .values span+span { border-left:1px solid var(--line); padding-left:11px; }
    .note { position:absolute; left:24px; right:24px; bottom:14px; text-align:center; color:#927d70; font-size:9px; letter-spacing:.16em; text-transform:uppercase; }
    @media (max-width:390px) { .page { width:100vw; } }
  </style>
</head>
